name: Build and GH-Page Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # the library, the docs and the examples are one pnpm workspace
      - name: Build package
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # the documentation, at the root of the site
      - name: Build docs
        run: pnpm --dir docs build

      # the examples under /examples/: the live example (examples/react) and
      # the basic one. The full app built with the library, GPX Terrain,
      # lives in its own repository (whidrubeld/gpx-terrain)
      - name: Build examples
        run: |
          for example in react basic; do
            pnpm --dir examples/$example build
            cp -R examples/$example/dist docs/dist/examples/$example
          done

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: docs/dist
